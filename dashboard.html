<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — ScanProgram</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<style>
  .programme-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .programme-card .top-row { display:flex; align-items:flex-start; justify-content:space-between; gap: var(--space-3); }
  .programme-card .emoji { font-size: 30px; }
  .programme-card h3 { font-size: 19px; margin: 0; }
  .programme-card .meta { color: var(--color-text-muted); font-size: 13px; }
  .programme-card .stats { display:flex; gap: var(--space-4); font-size: 13px; color: var(--color-text-muted); }
  .card-actions { display:flex; flex-wrap: wrap; gap: var(--space-2); margin-top: auto; }
  .dashboard-toolbar { display:flex; align-items:center; justify-content: space-between; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-3); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand">📱 ScanProgram</a>
    <nav>
      <ul class="nav-links">
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/create.html">+ Create New</a></li>
        <li data-admin-only style="display:none;"><a href="/admin.html">Admin</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <span data-user-name style="color: var(--color-text-muted); font-size: 14px;"></span>
      <button class="btn btn-ghost" data-logout>Log Out</button>
    </div>
    <button class="nav-toggle" data-nav-toggle aria-label="Toggle menu">☰</button>
  </div>
</header>

<main class="page-with-nav">
  <div class="container">
    <div class="dashboard-toolbar">
      <div>
        <h1 style="margin-bottom:4px;">My Programmes</h1>
        <p style="color:var(--color-text-muted); margin:0;">Manage all your digital programmes in one place.</p>
      </div>
      <a href="/create.html" class="btn btn-primary">+ Create New</a>
    </div>

    <div id="loading" class="spinner"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="emoji">📄</div>
      <h3>No programmes yet</h3>
      <p>Create your first digital programme to get a shareable link and QR code.</p>
      <a href="/create.html" class="btn btn-primary">+ Create New</a>
    </div>
    <div id="programme-grid" class="card-grid"></div>
  </div>
</main>

<script src="/js/utils/api.js"></script>
<script src="/js/utils/toast.js"></script>
<script src="/js/utils/modal.js"></script>
<script src="/js/utils/guard.js"></script>
<script src="/js/utils/share.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
