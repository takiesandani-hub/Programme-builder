<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ScanProgram</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="form-card">
    <a href="/index.html" class="brand" style="margin-bottom: var(--space-5); display:inline-flex;">📱 ScanProgram</a>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll help you reset it.</p>

    <div id="form-message"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <p class="form-footer-link"><a href="/login.html">Back to log in</a></p>
  </div>
</div>

<script src="/js/utils/api.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
