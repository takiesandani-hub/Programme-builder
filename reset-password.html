<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ScanProgram</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="form-card">
    <a href="/index.html" class="brand" style="margin-bottom: var(--space-5); display:inline-flex;">📱 ScanProgram</a>
    <h1>Choose a new password</h1>
    <p class="subtitle">Enter a new password for your account.</p>

    <div id="form-message"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        <div class="hint">At least 6 characters.</div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" name="confirmPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>

    <p class="form-footer-link"><a href="/login.html">Back to log in</a></p>
  </div>
</div>

<script src="/js/utils/api.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
