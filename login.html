<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ScanProgram</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="form-card">
    <a href="/index.html" class="brand" style="margin-bottom: var(--space-5); display:inline-flex;">📱 ScanProgram</a>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your programmes.</p>

    <div id="form-message"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="form-footer-link"><a href="/forgot-password.html">Forgot your password?</a></p>
    <p class="form-footer-link">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>
</div>

<script src="/js/utils/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
